<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos Yar-Yur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Animaciones */
        .fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-in-right { animation: slideInRight 0.3s ease-out forwards; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        
        /* Scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        
        /* Colores Categorías */
        .dot-rendimiento { background-color: #2563eb; color: white; box-shadow: 0 0 8px rgba(37, 99, 235, 0.4); } 
        .dot-visual { background-color: #16a34a; color: white; box-shadow: 0 0 8px rgba(22, 163, 74, 0.4); } 
        .dot-plano { background-color: #9333ea; color: white; box-shadow: 0 0 8px rgba(147, 51, 234, 0.4); } 
        .dot-muestra { background-color: #ca8a04; color: white; box-shadow: 0 0 8px rgba(202, 138, 4, 0.4); } 
        .dot-produccion { background-color: #ea580c; color: white; box-shadow: 0 0 8px rgba(234, 88, 12, 0.4); } 

        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Resaltado */
        .highlight-text {
            background-color: #fef08a;
            color: #1e293b;
            padding: 0 2px;
            border-radius: 2px;
            font-weight: 600;
        }
        
        /* Tooltip */
        #day-tooltip {
            transition: opacity 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-white text-slate-800 h-screen w-screen overflow-hidden flex flex-col relative">

    <div id="loading-indicator" class="fixed top-4 right-4 bg-white shadow-md rounded-full px-4 py-2 flex items-center gap-3 z-50 text-sm font-medium text-slate-500 transition-opacity opacity-0 pointer-events-none">
        <div class="loader"></div>
        <span id="loading-text">Indexando archivos...</span>
    </div>

    <div id="search-view" class="absolute inset-0 z-30 flex flex-col items-center justify-center p-6 transition-all duration-500 ease-in-out bg-white">
        <div class="w-full max-w-2xl text-center fade-in-up">
            <h1 class="text-4xl md:text-5xl font-black text-slate-900 mb-8 tracking-tight">Proyectos <span class="text-amber-500">Yar-Yur</span></h1>

                    placeholder="Buscar..." autocomplete="off">

    </div>

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>

    <div id="results-view" class="absolute inset-0 z-20 bg-slate-50 flex flex-col translate-y-full transition-transform duration-500 ease-in-out">

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>

    <script>
        // --- CONFIGURACIÓN DE ARCHIVOS ---
        const PERSONAL_FILES = [
            '2025-01 ENERO 2025.json', '2025-02 FEBRERO 2025.json', '2025-03 MARZO 2025.json', '2025-04 ABRIL 2025.json',
            '2025-05 MAYO 2025.json', '2025-06 JUNIO 2025.json', '2025-07 JULIO 2025.json', '2025-08 AGOSTO 2025.json',
            '2025-09 SEPTIEMBRE 2025.json', '2025-10 OCTUBRE 2025.json', '2025-11 NOVIEMBRE 2025.json', '2025-12 DICIEMBRE 2025.json',
            '2026-01 ENERO 2026.json', '2026-02 FEBRERO 2026.json', '2026-03 MARZO 2026.json', '2026-04 ABRIL 2026.json',
            '2026-05 MAYO 2026.json', '2026-06 JUNIO 2026.json', '2026-07 JULIO 2026.json', '2026-08 AGOSTO 2026.json',
            '2026-09 SEPTIEMBRE 2026.json', '2026-10 OCTUBRE 2026.json', '2026-11 NOVIEMBRE 2026.json', '2026-12 DICIEMBRE 2026.json'
        ];
        const COMPANY_FILES = [
            'proyectos-inversiones-yar-yur-2022.json', 'proyectos-inversiones-yar-yur-2023.json',
            'proyectos-inversiones-yar-yur-2024.json', 'proyectos-inversiones-yar-yur-2025.json',
            'proyectos-inversiones-yar-yur-2026.json'
        ];
        
        const FORCED_CLIENTS = [
            'CHARCUTERIA TOVAR', 'ISOLA FOODS', 'TIA SU', 'INVERSIONES VI&CO 10', 'INVERSIONES ZOAH',
            'LUBRICANTES BLITZ 2000', 'TODO CONSTRUCCION', 'CERVEZA CHUMACEIRO', 'GRUPO CASHEW',
            'LA VIENESA', 'BIG WADE', 'VESPEX', 'CONFECCIONES TREVI', 'CAFE CITY', 'REMIGTON CENTER',
            'CORPORACION RETAIL', 'BRANYESKA', 'RONALD', 'PRINGLES', 'GRUPO KAIZEN', 'LUIS MARQUEZ',
            'SAMSUNG', 'SAJYS DELICIOUS CAKE', 'PIZZERIA MAMARRACHOS', 'RUANSA', 'MARIO SACRIPANTI',
            'HOLY MARY', 'PAYALL', 'CHEF TONY', 'VILLA BRAIDA', 'LEDDY', 'NEW ARRIVAL', 'ARIZONA',
            'NUDELI', 'TUCHELA2', 'DISTRIBUIDORA BELL NUTRI', 'ADVENTURE', 'ONLY PAN', 'EL GARZON',
            'INVERSIONES CANAIMA', 'BOLIPUERTOS', 'AVELINA', 'INVERSIONES VI&CO10', 'AZUCAR MONTALBAN',
            'CARGILL', 'BRANYESCKA', 'CHICO KALOHA', 'INVERSIONES KARAKA', 'KASU', 'BODEGA CREATIVA',
            'MAILOS CHIPS', 'CARMINE', 'PEPBOYS', 'LABORATORIO BUKA', 'TABACALERA NACIONAL', 'MIMADITO',
            'CERVECERIA ZULIA', 'POTIO', 'ORCAS', 'LA CARNITA', 'SURA DE VZLA', 'MARIA PIA', 'EXCHANGE',
            'CASA GOURMET', 'MOTUL', 'COCOS GROUP', 'SERVICIOS FUNERARIOS', 'UNICARNES', 'GRUPO MISTRAL',
            'AKTIVA BRANDS', 'P&G', 'BRAYESCKA', 'MARÍA PÍA', 'ALEJANDRO MORALES', 'PAN PARIS',
            'ALEJANDRO MORALE', 'DONACION A POLICIA', 'LUIS FELIPE LONA', 'PANDERIA CUMBRES',
            'PAÑALES VICO10', 'DOÑA JURA', 'ALIZZETS', 'LAVANSAN', 'COMPAÑIA ANONIMA DE CINES UNIDOS',
            'LA CASA DE LAS TEJAS', 'NATIONAL SALES (NASRI)', 'ANIBAL GUTIERREZ', 'FRATELSA', 'ONLYPAN',
            'INVERSIONES PELUCHES' 
        ];

        // --- COLORES ---
        const GRAY_STYLE = 'bg-slate-100 text-slate-600 border-slate-200';
        const TRELLO_COLORS = {
            'lime': GRAY_STYLE, 'yellow': GRAY_STYLE, 'orange': GRAY_STYLE, 'red': GRAY_STYLE,
            'purple': GRAY_STYLE, 'blue': GRAY_STYLE, 'sky': GRAY_STYLE, 'pink': GRAY_STYLE,
            'green': GRAY_STYLE, 'black': 'bg-slate-800 text-white border-slate-900', 'default': GRAY_STYLE
        };

        const CAT_STYLES = {
            'RENDIMIENTO': { card: 'bg-blue-100 border-blue-200 hover:border-blue-500 hover:ring-1 hover:ring-blue-500 hover:shadow-md', badge: 'bg-white text-blue-700 border-blue-200', dotClass: 'dot-rendimiento', btnColor: 'bg-blue-600 hover:bg-blue-700' },
            'VISUAL': { card: 'bg-green-100 border-green-200 hover:border-green-500 hover:ring-1 hover:ring-green-500 hover:shadow-md', badge: 'bg-white text-green-700 border-green-200', dotClass: 'dot-visual', btnColor: 'bg-green-600 hover:bg-green-700' },
            'PLANO MECÁNICO': { card: 'bg-purple-100 border-purple-200 hover:border-purple-500 hover:ring-1 hover:ring-purple-500 hover:shadow-md', badge: 'bg-white text-purple-700 border-purple-200', dotClass: 'dot-plano', btnColor: 'bg-purple-600 hover:bg-purple-700' },
            'MUESTRA': { card: 'bg-yellow-50 border-yellow-200 hover:border-yellow-600 hover:ring-1 hover:ring-yellow-600 hover:shadow-md', badge: 'bg-white text-yellow-700 border-yellow-300', dotClass: 'dot-muestra', btnColor: 'bg-yellow-600 hover:bg-yellow-700' },
            'PRODUCCIÓN': { card: 'bg-orange-100 border-orange-200 hover:border-orange-500 hover:ring-1 hover:ring-orange-500 hover:shadow-md', badge: 'bg-white text-orange-700 border-orange-200', dotClass: 'dot-produccion', btnColor: 'bg-orange-500 hover:bg-orange-600' },
            'OTRO': { card: 'bg-slate-100 border-slate-200 hover:border-slate-500 hover:ring-1 hover:ring-slate-500 hover:shadow-md', badge: 'bg-white text-slate-600 border-slate-200', dotClass: 'bg-slate-400 text-white', btnColor: 'bg-slate-500 hover:bg-slate-600' }
        };

        const MONTH_NAMES = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];
        const MONTH_MAP = { "ENERO": 1, "FEBRERO": 2, "MARZO": 3, "ABRIL": 4, "MAYO": 5, "JUNIO": 6, "JULIO": 7, "AGOSTO": 8, "SEPTIEMBRE": 9, "OCTUBRE": 10, "NOVIEMBRE": 11, "DICIEMBRE": 12 };

        // --- ESTADO GLOBAL ---
        let mergedData = []; 
        let activeSearchQuery = '';
        let currentClientName = '';
        let projectGroupsCache = {}; 
        let activeCategoryFilter = null;
        
        let isClientListFiltered = true; 
        let isProjectListFiltered = true;
        let isFinalViewFiltered = true;
        
        let viewMode = 'CLIENT'; // 'CLIENT', 'YEAR' o 'CHART_FILTER'
        let activeYearFilter = '';
        let chartFilter = null; 
        let statsChartInstance = null;
        
        // Variables para el control de la ventana (tooltip)
        window.currentRenderedFinalItems = [];
        let isTooltipPinned = false;
        window.pinnedDayKey = null;

        const loadingIndicator = document.getElementById('loading-indicator');
        const mainInput = document.getElementById('main-search-input');
        const headerInput = document.getElementById('header-search-input');
        const resultsView = document.getElementById('results-view');
        const searchView = document.getElementById('search-view');
        const projectListView = document.getElementById('project-list-view');
        const finalView = document.getElementById('final-view');
        const chartView = document.getElementById('chart-view'); 
        const resultsContainer = document.getElementById('results-container');
        const projectListContainer = document.getElementById('project-list-container');
        const finalCalendarContainer = document.getElementById('final-calendar-container');
        
        // Cierra el tooltip si se hace clic afuera
        document.addEventListener('click', (e) => {
            if (isTooltipPinned) {
                const tooltip = document.getElementById('day-tooltip');
                if (!tooltip.contains(e.target) && !e.target.closest('.day-dot')) {
                    isTooltipPinned = false;
                    window.pinnedDayKey = null;
                    tooltip.classList.add('pointer-events-none');
                    tooltip.classList.remove('pointer-events-auto');
                    hideDayTooltip(true);
                }
            }
        });

        // --- UTILS BÚSQUEDA ---
        function normalizeStr(str) { return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }

        window.onload = loadAllData;

        // --- FUNCIÓN DE CARGA ---
        async function loadAllData() {
            loadingIndicator.style.opacity = '1';
            try {
                const personalPromises = PERSONAL_FILES.map(file => fetch(file).then(r => r.ok ? r.json() : null).catch(e => null));
                const companyPromises = COMPANY_FILES.map(file => fetch(file).then(r => r.ok ? r.json() : null).catch(e => null));
                const [personalResults, companyResults] = await Promise.all([ Promise.all(personalPromises), Promise.all(companyPromises) ]);
                const validPersonal = personalResults.filter(d => d !== null);
                const validCompany = companyResults.filter(d => d !== null);

                processAndMergeData(validPersonal, validCompany);
                
                mainInput.disabled = false;
                mainInput.focus();
            } catch (e) {
                console.error("Error fatal iniciando la app:", e);
                mainInput.placeholder = "Error al conectar con archivos locales.";
            } finally {
                loadingIndicator.style.opacity = '0';
            }
        }

        function processAndMergeData(personalRawList, companyRawList) {
            let flatPersonal = [];
            const realClientsSet = new Set();
            FORCED_CLIENTS.forEach(fc => realClientsSet.add(fc));

            companyRawList.forEach((compData, idx) => {
                if (!compData) return;
                const fileName = COMPANY_FILES[idx] || "";
                if (fileName.includes('2022')) return;
                const cardsList = compData.cards || (Array.isArray(compData) ? compData : []);
                if (!Array.isArray(cardsList)) return;
                cardsList.forEach(card => {
                    if (card.closed) return;
                    let num = null;
                    const match = card.name.match(/^((?:TENTATIVO\s+)?\d{2,4}(?:_\d+)?\/\d{2})/i);
                    if (match) num = match[1];
                    else num = "EXT-" + card.id;
                    let cleanName = match ? card.name.substring(num.length).replace(/^[\s\-\.]+/, '') : card.name;
                    let parts = cleanName.split(/[-–—]/);
                    let potentialClient = parts[0] ? parts[0].trim() : "SIN CLIENTE";
                    if (potentialClient.toUpperCase().includes("TENTATIVO") && parts[1]) potentialClient = parts[1].trim();
                    if (potentialClient && potentialClient.length > 2) realClientsSet.add(potentialClient.toUpperCase());
                });
            });

            if (Array.isArray(personalRawList)) {
                personalRawList.forEach(fileContent => {
                    if (Array.isArray(fileContent)) {
                        fileContent.forEach(table => {
                            if (table && table.proyectos && Array.isArray(table.proyectos)) {
                                table.proyectos.forEach(p => {
                                    if (!p.trabajoDiseno) return;
                                    if (p.trabajoDiseno.toUpperCase().includes('AUTORIZA')) return;
                                    const searchText = `${p.cliente || ''} ${p.tituloProyecto || ''} ${p.numeroProyecto || ''} ${p.descripcion || ''} ${p.check || ''}`;
                                    flatPersonal.push({ ...p, mesGrupo: table.mes, searchIndex: searchText });
                                });
                            }
                        });
                    }
                });
            }

            let companyProjectsMap = {}; 
            
            companyRawList.forEach((compData, idx) => {
                if (!compData) return;
                const fileName = COMPANY_FILES[idx] || "";
                const yearMatch = fileName.match(/202[0-9]/);
                const sourceYear = yearMatch ? yearMatch[0] : "EXT"; 

                const lists = compData.lists || [];
                const restrictedListIds = new Set();
                lists.forEach(l => {
                    const name = l.name ? l.name.toUpperCase().trim() : '';
                    if (name === 'COMPRAS' || name === 'TERMINADO DE COMPRAS') restrictedListIds.add(l.id);
                });

                let cardsList = compData.cards || (Array.isArray(compData) ? compData : []);
                if (!Array.isArray(cardsList)) return;
                const labelsMap = {};
                if(compData.labels) compData.labels.forEach(l => labelsMap[l.id] = l);

                cardsList.forEach(card => {
                    if(card.closed) return;
                    if (card.idList && restrictedListIds.has(card.idList)) return;
                    let num = null;
                    const match = card.name.match(/^((?:TENTATIVO\s+)?\d{2,4}(?:_\d+)?\/\d{2})/i); 
                    if(match) num = match[1].toUpperCase(); else num = "EXT-" + card.id; 
                    let cleanName = match ? card.name.substring(num.length).replace(/^[\s\-\.]+/, '') : card.name;
                    let parts = cleanName.split(/[-–—]/); 
                    let client = parts[0] ? parts[0].trim() : "SIN CLIENTE";
                    if (client.toUpperCase().includes("TENTATIVO") && parts[1]) client = parts[1].trim();
                    let title = parts.slice(1).join(' ').trim() || client;

                    if (sourceYear === '2022' && !realClientsSet.has(client.toUpperCase())) {
                        client = "2022"; title = match ? cleanName : card.name;
                    }

                    if (!match && parts.length === 1 && sourceYear !== '2022') { title = card.name; client = "VARIOS"; }

                    const tags = (card.idLabels || []).map(id => labelsMap[id]).filter(t => t);
                    const tagNames = tags.map(t => t.name).join(' ');
                    const companySearchIndex = `${card.name} ${client} ${title} ${num} ${tagNames} ${card.desc || ''}`;
                    
                    let trelloDate = "";
                    if (card.due) {
                        const d = new Date(card.due); trelloDate = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
                    } else if (card.dateLastActivity) {
                        const d = new Date(card.dateLastActivity); trelloDate = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
                    }

                    companyProjectsMap[num] = {
                        numeroProyecto: match ? num : '', rawId: num, cliente: client, tituloProyecto: title,
                        trelloUrl: card.url || `https://trello.com/c/${card.shortLink}`, tags: tags, fecha: trelloDate,
                        isExternal: true, sourceYear: sourceYear, searchIndex: companySearchIndex
                    };
                });
            });

            flatPersonal.forEach(p => {
                const num = p.numeroProyecto ? p.numeroProyecto.trim() : null;
                if(num && companyProjectsMap[num]) {
                    const comp = companyProjectsMap[num];
                    p.cliente = comp.cliente; p.tituloProyecto = comp.tituloProyecto;
                    p.trelloTags = comp.tags; p.trelloUrl = comp.trelloUrl; p.sourceYear = comp.sourceYear; 
                    p.searchIndex += " " + comp.searchIndex; comp.merged = true;
                }
            });

            Object.values(companyProjectsMap).forEach(comp => {
                if(!comp.merged) {
                    flatPersonal.push({
                        cliente: comp.cliente, tituloProyecto: comp.tituloProyecto, numeroProyecto: comp.numeroProyecto,
                        descripcion: "Registro externo en Trello.", fecha: comp.fecha, trabajoDiseno: "PRODUCCIÓN", 
                        isExternal: true, trelloTags: comp.tags, trelloUrl: comp.trelloUrl, sourceYear: comp.sourceYear, 
                        entries: [], searchIndex: comp.searchIndex
                    });
                }
            });

            mergedData = flatPersonal;
            console.log(`✅ Datos procesados: ${mergedData.length}`);
        }

        // --- LÓGICA DE BÚSQUEDA ---
        mainInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(mainInput.value); });
        headerInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(headerInput.value); });

        function performSearch(query) {
            const cleanQuery = query.trim();
            if (!cleanQuery) return;
            const lowerQuery = cleanQuery.toLowerCase();

            // CASO 1: ESTADÍSTICAS POR MES Y AÑO
            const chartMatch = cleanQuery.match(/^(ENERO|FEBRERO|MARZO|ABRIL|MAYO|JUNIO|JULIO|AGOSTO|SEPTIEMBRE|OCTUBRE|NOVIEMBRE|DICIEMBRE)\s+(202[2-6])$/i);
            if (chartMatch) {
                showStatsChart(chartMatch[1].toUpperCase(), chartMatch[2]);
                return;
            }

            // CASO 2: CLIENTES
            if (lowerQuery === 'clientes') {
                viewMode = 'CLIENT';
                activeSearchQuery = ''; 
                isClientListFiltered = false; 
                renderClientSelectionList();
                openResultsView();
                document.getElementById('results-title').innerText = "Listado General de Clientes";
                headerInput.value = "";
                return;
            }

            // CASO 3: AÑOS
            const yearMatch = cleanQuery.match(/^202[2-6]$/);
            if (yearMatch) {
                viewMode = 'YEAR';
                activeYearFilter = cleanQuery;
                activeSearchQuery = cleanQuery;
                resultsView.classList.add('translate-y-full'); 
                searchView.classList.add('-translate-y-full', 'opacity-0');
                chartView.classList.add('translate-x-full'); 
                renderProjectListContent(); 
                projectListView.classList.remove('translate-x-full');
                return;
            }

            // CASO 4: BÚSQUEDA NORMAL
            viewMode = 'CLIENT';
            activeSearchQuery = cleanQuery;
            isClientListFiltered = true;
            renderClientSelectionList();
            
            if (!projectListView.classList.contains('translate-x-full')) closeProjectListView();
            chartView.classList.add('translate-x-full');
            openResultsView();
            headerInput.value = activeSearchQuery;
        }

        function itemMatchesChartFilter(item) {
            if (!chartFilter) return true;
            if (item.isExternal) return false;
            
            let cat = item.trabajoDiseno ? item.trabajoDiseno.toUpperCase().trim() : 'OTRO';
            if (cat !== chartFilter.category) return false;
            
            if (!item.fecha) return false;
            const [d, m, y] = item.fecha.split('/');
            if (!m || !y) return false;
            if (parseInt(m, 10) !== chartFilter.month || parseInt(y, 10) !== chartFilter.year) return false;
            
            return true;
        }

        function activateChartFilter(month, year, monthName, category) {
            chartFilter = { month, year, monthName, category };
            viewMode = 'CHART_FILTER';
            activeSearchQuery = '';
            
            renderClientSelectionList();
            chartView.classList.add('translate-x-full');
            resultsView.classList.remove('translate-y-full');
            resetScroll('results-view');
        }

        function showStatsChart(monthName, yearStr) {
            const targetMonth = MONTH_MAP[monthName];
            const targetYear = parseInt(yearStr, 10);

            const filteredData = mergedData.filter(item => {
                if (item.isExternal) return false; 
                if (item.fecha) {
                    const [d, m, y] = item.fecha.split('/');
                    if (m && y) {
                        return parseInt(m, 10) === targetMonth && parseInt(y, 10) === targetYear;
                    }
                }
                return false;
            });

            const counts = { 'RENDIMIENTO': 0, 'VISUAL': 0, 'PLANO MECÁNICO': 0, 'MUESTRA': 0, 'PRODUCCIÓN': 0 };

            filteredData.forEach(item => {
                let cat = item.trabajoDiseno ? item.trabajoDiseno.toUpperCase().trim() : 'OTRO';
                if (counts[cat] !== undefined) counts[cat]++;
            });

            const ctx = document.getElementById('statsChart').getContext('2d');
            if (statsChartInstance) statsChartInstance.destroy(); 

            document.getElementById('chart-view-title').innerText = `Estadísticas: ${monthName} ${yearStr}`;

            statsChartInstance = new Chart(ctx, {
                type: 'bar',
                plugins: [ChartDataLabels],
                data: {
                    labels: ['RENDIMIENTO', 'VISUAL', 'PLANO MECÁNICO', 'MUESTRA', 'PRODUCCIÓN'],
                    datasets: [{
                        label: 'Cantidad de Trabajos',
                        data: [ counts['RENDIMIENTO'], counts['VISUAL'], counts['PLANO MECÁNICO'], counts['MUESTRA'], counts['PRODUCCIÓN'] ],
                        backgroundColor: [
                            'rgba(37, 99, 235, 0.8)', 'rgba(22, 163, 74, 0.8)', 'rgba(147, 51, 234, 0.8)', 'rgba(202, 138, 4, 0.8)', 'rgba(234, 88, 12, 0.8)'
                        ],
                        borderColor: [
                            'rgb(37, 99, 235)', 'rgb(22, 163, 74)', 'rgb(147, 51, 234)', 'rgb(202, 138, 4)', 'rgb(234, 88, 12)'
                        ],
                        borderWidth: 1, borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { top: 40 } },
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            const category = statsChartInstance.data.labels[index];
                            if (counts[category] > 0) {
                                activateChartFilter(targetMonth, targetYear, monthName, category);
                            }
                        }
                    },
                    onHover: (event, elements) => {
                        const isClickable = elements.length > 0 && counts[statsChartInstance.data.labels[elements[0].index]] > 0;
                        event.native.target.style.cursor = isClickable ? 'pointer' : 'default';
                    },
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true, text: `Rendimiento de Diseño Personal - ${monthName} ${yearStr}`,
                            font: { size: 16, family: "'Inter', sans-serif", weight: 'bold' }, padding: { bottom: 20 }
                        },
                        datalabels: {
                            anchor: 'end', align: 'top', color: '#334155',
                            font: { size: 28, weight: 'black', family: "'Inter', sans-serif" },
                            formatter: function(value) { return value > 0 ? value : ''; }
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, grace: '15%', ticks: { stepSize: 1, font: { family: "'Inter', sans-serif" } } },
                        x: { ticks: { font: { family: "'Inter', sans-serif", weight: 'bold' } } }
                    }
                }
            });

            searchView.classList.add('-translate-y-full', 'opacity-0');
            resultsView.classList.add('translate-y-full');
            projectListView.classList.add('translate-x-full');
            finalView.classList.add('translate-x-full');
            chartView.classList.remove('translate-x-full');
        }

        function closeChartView() {
            chartView.classList.add('translate-x-full');
            searchView.classList.remove('-translate-y-full', 'opacity-0');
            mainInput.value = '';
            viewMode = 'CLIENT'; 
            chartFilter = null;
            setTimeout(() => mainInput.focus(), 500);
        }

        function itemMatchesQuery(item, query) {
            if (!query) return true;
            const q = query.toLowerCase();
            if (q === 'falta') return item.check && String(item.check).toUpperCase() === 'FALTA';
            const normQuery = normalizeStr(query);
            const normText = normalizeStr(item.searchIndex || '');
            const tokens = normQuery.split(/\s+/).filter(t => t.length > 0);
            return tokens.every(token => normText.includes(token));
        }

        function highlightMatch(text, query) {
            if (!text || !query) return text;
            if (query.toLowerCase() === 'falta' || query.match(/^202[2-6]$/)) return text;
            const normText = normalizeStr(text);
            const tokens = normalizeStr(query).split(/\s+/).filter(t => t.length > 0);
            if (tokens.length === 0) return text;
            const shouldHighlight = new Array(text.length).fill(false);
            tokens.forEach(token => {
                let startIndex = 0;
                while (true) {
                    const idx = normText.indexOf(token, startIndex);
                    if (idx === -1) break;
                    for (let i = 0; i < token.length; i++) { if (idx + i < text.length) shouldHighlight[idx + i] = true; }
                    startIndex = idx + 1;
                }
            });
            let result = ''; let isHighlighting = false;
            for (let i = 0; i < text.length; i++) {
                if (shouldHighlight[i] && !isHighlighting) { result += '<span class="highlight-text">'; isHighlighting = true; } 
                else if (!shouldHighlight[i] && isHighlighting) { result += '</span>'; isHighlighting = false; }
                result += text[i];
            }
            if (isHighlighting) result += '</span>';
            return result;
        }

        function renderFilterButton(containerId, query, onClickFn) {
            const container = document.getElementById(containerId);
            const mobileContainer = document.getElementById(containerId + '-mobile');
            let html = '';
            
            if (viewMode === 'CHART_FILTER' && chartFilter) {
                html = `<div class="flex items-center gap-2 bg-slate-800 text-white border border-slate-700 px-4 py-1.5 rounded-full text-xs font-bold shadow-sm"><span>${query}</span></div>`;
            }
            else if (viewMode === 'YEAR' && activeYearFilter) {
                 html = `<div class="flex items-center gap-2 bg-blue-100 text-blue-800 border border-blue-200 px-4 py-1.5 rounded-full text-xs font-bold shadow-sm"><span>Año: ${activeYearFilter}</span></div>`;
            } 
            else if (query && query !== 'falta' && query !== 'clientes') {
                html = `<button onclick="${onClickFn}" class="group flex items-center gap-2 bg-yellow-100 text-yellow-800 hover:bg-red-100 hover:text-red-700 border border-yellow-200 hover:border-red-200 px-4 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm animate-pulse"><span>"${query}"</span><svg class="w-3 h-3 opacity-60 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>`;
            }
            if (container) container.innerHTML = html;
            if (mobileContainer) mobileContainer.innerHTML = html;
        }

        function getProjectSortValue(p) {
            if (!p.number) return 999999;
            const match = p.number.match(/(\d+(?:_\d+)?)\/(\d+)/);
            if (!match) return 999999;
            const num = parseInt(match[1], 10);
            const year = parseInt(match[2], 10);
            return (year * 10000) + num;
        }

        function checkItemYear(item, yearStr) {
            const shortYear = yearStr.substring(2); 
            const numberMatch = item.numeroProyecto ? item.numeroProyecto.match(/\/(\d{2})$/) : null;
            if (numberMatch) return numberMatch[1] === shortYear;
            if (item.fecha && item.fecha.includes(yearStr)) return true;
            return false;
        }

        function renderClientSelectionList() {
            let filterText = '';
            if (viewMode === 'CHART_FILTER') {
                filterText = `${chartFilter.monthName} ${chartFilter.year} - ${chartFilter.category}`;
                renderFilterButton('client-filter-container', filterText, ''); 
            } else {
                const query = isClientListFiltered ? activeSearchQuery : '';
                renderFilterButton('client-filter-container', query, 'unfilterClients()');
            }

            const clientGroups = {};
            mergedData.forEach(item => {
                let match = false;
                if (viewMode === 'CHART_FILTER') {
                    match = itemMatchesChartFilter(item);
                } else if (!isClientListFiltered || itemMatchesQuery(item, activeSearchQuery)) {
                    match = true;
                }

                if (match) {
                    if (!clientGroups[item.cliente]) clientGroups[item.cliente] = [];
                    clientGroups[item.cliente].push(item);
                }
            });

            const sortedClients = Object.keys(clientGroups)
                .map(clientName => {
                    const items = clientGroups[clientName];
                    const uniqueIds = new Set(items.map(i => i.numeroProyecto || i.tituloProyecto));
                    return { name: clientName, items, count: uniqueIds.size };
                })
                .filter(c => c.name !== 'SIN CLIENTE')
                .sort((a, b) => {
                    if (a.name === '2022') return 1; 
                    if (b.name === '2022') return -1; 
                    return b.count - a.count; 
                });

            if (viewMode === 'CHART_FILTER') {
                document.getElementById('results-title').innerText = `Filtro: ${chartFilter.category}`;
                document.getElementById('results-subtitle').innerText = `${sortedClients.length} clientes en ${chartFilter.monthName} ${chartFilter.year}`;
            } else {
                document.getElementById('results-title').innerText = activeSearchQuery ? `Búsqueda: "${activeSearchQuery}"` : "Todos los Clientes";
                document.getElementById('results-subtitle').innerText = `${sortedClients.length} clientes encontrados`;
            }

            if (sortedClients.length === 0) {
                resultsContainer.innerHTML = `<div class="text-center py-20 text-slate-400">No hay resultados.</div>`;
                return;
            }

            const maxCount = sortedClients.length > 0 ? sortedClients[0].count : 1;
            let html = '<div class="flex flex-col gap-3">';
            sortedClients.forEach((c, idx) => {
                const percentage = Math.round((c.count / maxCount) * 100);
                const bgStyle = `background: linear-gradient(90deg, #fcd34d ${percentage}%, white ${percentage}%);`;
                
                const hlName = (viewMode === 'CHART_FILTER') ? c.name : highlightMatch(c.name, activeSearchQuery);
                const safeClientName = c.name.replace(/"/g, '&quot;');
                
                html += `<div onclick="openProjectListView(this.dataset.client)" data-client="${safeClientName}" style="${bgStyle}" class="p-5 rounded-xl border border-slate-200 hover:shadow-md transition-all cursor-pointer group relative overflow-hidden"><div class="flex items-center relative z-10 gap-4"><span class="text-2xl font-black text-slate-600 font-mono w-8 text-right shrink-0">${idx + 1}</span><div class="flex-1"><h3 class="font-bold text-lg text-slate-800 group-hover:text-amber-600 transition-colors">${hlName}</h3><p class="text-sm text-slate-500 font-medium">${c.count} proyectos</p></div><div class="h-10 w-10 bg-white/50 backdrop-blur-sm rounded-full flex items-center justify-center text-slate-400 group-hover:text-amber-600 shadow-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></div></div></div>`;
            });
            html += '</div>';
            resultsContainer.innerHTML = html;
        }

        function unfilterClients() { isClientListFiltered = false; renderClientSelectionList(); }

        function renderProjectListContent() {
            let filteredItems = [];
            let listTitle = "";

            if (viewMode === 'CHART_FILTER') {
                listTitle = currentClientName;
                filteredItems = mergedData.filter(i => i.cliente === currentClientName && itemMatchesChartFilter(i));
                let filterText = `${chartFilter.monthName} ${chartFilter.year} - ${chartFilter.category}`;
                renderFilterButton('project-filter-container', filterText, ''); 
            }
            else if (viewMode === 'YEAR') {
                listTitle = `Proyectos ${activeYearFilter}`;
                filteredItems = mergedData.filter(i => checkItemYear(i, activeYearFilter));
                renderFilterButton('project-filter-container', '', ''); 
            } else {
                const query = isProjectListFiltered ? activeSearchQuery : '';
                renderFilterButton('project-filter-container', query, 'unfilterProjects()');
                listTitle = currentClientName;
                filteredItems = mergedData.filter(i => i.cliente === currentClientName && itemMatchesQuery(i, query));
            }

            document.getElementById('project-list-title').innerText = listTitle;

            projectGroupsCache = {};
            const grouped = {};
            
            filteredItems.forEach(item => {
                const key = (item.numeroProyecto && item.numeroProyecto.trim().length > 2) ? item.numeroProyecto : item.tituloProyecto;
                if (!grouped[key]) {
                    grouped[key] = { key: key, number: item.numeroProyecto, title: item.tituloProyecto, items: [], isExternal: !!item.isExternal, trelloTags: item.trelloTags || [], clientName: item.cliente, sourceYear: item.sourceYear };
                }
                grouped[key].items.push(item);
                if(!item.isExternal) grouped[key].isExternal = false; 

                if(item.trelloTags) {
                     const existing = new Set((grouped[key].trelloTags || []).map(t => t.name));
                     if(!grouped[key].trelloTags) grouped[key].trelloTags = [];
                     item.trelloTags.forEach(t => { if(!existing.has(t.name)) grouped[key].trelloTags.push(t); });
                }
            });

            let projectsArray = Object.values(grouped);
            
            projectsArray.sort((a, b) => {
                const isTentativeA = (a.number + a.title).toUpperCase().includes('TENTATIVO');
                const isTentativeB = (b.number + b.title).toUpperCase().includes('TENTATIVO');
                if (isTentativeA !== isTentativeB) return isTentativeA ? 1 : -1;

                if (viewMode === 'YEAR') { return getProjectSortValue(a) - getProjectSortValue(b); } 
                else {
                    if (a.isExternal !== b.isExternal) return a.isExternal ? 1 : -1;
                    if (!a.isExternal) return b.items.length - a.items.length;
                    return getProjectSortValue(b) - getProjectSortValue(a);
                }
            });

            if (projectsArray.length === 0) {
                projectListContainer.innerHTML = `<div class="text-center py-20 text-slate-400">No se encontraron proyectos.</div>`;
                return;
            }

            const maxEntries = projectsArray.length > 0 ? (projectsArray.find(p => !p.isExternal)?.items.length || 1) : 1;
            let html = '';
            
            projectsArray.forEach((p, idx) => {
                const groupId = `group_${idx}`;
                projectGroupsCache[groupId] = p;

                const count = p.items.length;
                let barColor = p.isExternal ? '#cbd5e1' : '#dcfce7'; 
                let topRightContent = '';
                const trelloUrl = p.items[0]?.trelloUrl;
                let onClickAttr = `onclick="openFinalView(this.dataset.group)" data-group="${groupId}"`;
                let cursorClass = 'cursor-pointer hover:shadow-md hover:ring-1 hover:ring-green-200';
                let titleHoverClass = 'group-hover:text-green-700';
                let iconSvg = `<svg class="w-5 h-5 text-slate-300 group-hover:text-green-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;

                if (p.isExternal) {
                    onClickAttr = ''; cursorClass = 'cursor-default'; titleHoverClass = 'text-slate-700'; iconSvg = ''; 
                    const yearLabel = p.sourceYear ? `<span class="text-xs font-black text-slate-400 mt-1">${p.sourceYear}</span>` : '';
                    if (trelloUrl) {
                        const safeUrl = trelloUrl.replace(/"/g, '&quot;');
                        topRightContent = `<div class="flex flex-col items-center justify-center"><a href="${safeUrl}" target="_blank" class="flex items-center gap-1 text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-600 hover:text-white px-2 py-1 rounded transition-all border border-blue-200 hover:border-blue-600 z-20 relative shadow-sm"><span>Trello</span><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg></a>${yearLabel}</div>`;
                    } else { topRightContent = `<div class="flex flex-col items-center justify-center"><span class="text-xs text-slate-400 font-medium">Trello (Sin Link)</span>${yearLabel}</div>`; }
                } else { topRightContent = `<span class="text-xs text-slate-400 font-medium">${count} entradas</span>`; }

                const percentage = (viewMode === 'YEAR' || p.isExternal) ? 100 : Math.round((count / maxEntries) * 100);
                const bgStyle = `background: linear-gradient(90deg, ${barColor} ${percentage}%, white ${percentage}%);`;

                let tagsHtml = '';
                if(p.trelloTags && p.trelloTags.length > 0) {
                    tagsHtml = `<div class="flex flex-wrap gap-1 mt-1">` + p.trelloTags.map(t => `<span class="text-[9px] px-1.5 py-0.5 rounded border ${TRELLO_COLORS[t.color] || TRELLO_COLORS['default']} font-bold uppercase opacity-80">${t.name}</span>`).join('') + `</div>`;
                }

                let clientLabelHtml = (viewMode === 'YEAR') ? `<div class="text-[10px] font-bold text-amber-600 uppercase tracking-wider mb-0.5">${p.clientName}</div>` : '';
                
                const showHighlight = viewMode !== 'CHART_FILTER';
                const hlTitle = showHighlight ? highlightMatch(p.title, activeSearchQuery) : p.title;
                const hlNum = showHighlight ? highlightMatch(p.number || '', activeSearchQuery) : (p.number || '');
                
                html += `<div ${onClickAttr} style="${bgStyle}" class="p-4 rounded-xl border border-slate-200 shadow-sm transition-all ${cursorClass} group relative"><div class="flex items-start gap-3 relative z-10"><span class="text-lg font-black text-slate-600 font-mono w-6 text-right pt-1">${idx + 1}</span><div class="flex-1"><div class="flex justify-between items-start"><div class="flex items-center gap-2 mb-1">${p.number ? `<span class="text-xs font-mono font-bold text-slate-500 bg-white/80 backdrop-blur-sm px-2 py-0.5 rounded border border-slate-200">${hlNum}</span>` : ''}</div>${topRightContent}</div>${clientLabelHtml}<h3 class="font-bold text-base leading-tight text-slate-800 ${titleHoverClass} transition-colors">${hlTitle}</h3>${tagsHtml}</div><div class="self-center">${iconSvg}</div></div></div>`;
            });
            projectListContainer.innerHTML = html;
        }

        function unfilterProjects() { isProjectListFiltered = false; renderProjectListContent(); }

        function openFinalView(groupId) {
            const groupData = projectGroupsCache[groupId];
            if (!groupData) return;

            const targetClient = viewMode === 'YEAR' ? groupData.clientName : currentClientName;
            const fullProjectItems = mergedData.filter(item => {
                const key = (item.numeroProyecto && item.numeroProyecto.trim().length > 2) ? item.numeroProyecto : item.tituloProyecto;
                return key === groupData.key && item.cliente === targetClient; 
            });
            
            window.currentViewItems = fullProjectItems; 
            window.currentViewExternal = groupData.isExternal;
            
            document.getElementById('final-view-title').innerText = `${groupData.number || ''} ${groupData.title}`;
            
            const itemWithUrl = fullProjectItems.find(i => i.trelloUrl) || mergedData.find(i => (i.numeroProyecto === groupData.number || i.tituloProyecto === groupData.title) && i.trelloUrl);
            document.getElementById('final-view-links').innerHTML = (itemWithUrl && itemWithUrl.trelloUrl) ? `<a href="${itemWithUrl.trelloUrl}" target="_blank" class="flex items-center gap-1.5 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded transition-colors shadow-sm"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 15H7V7h5v10zm5-4h-3V7h3v6z"/></svg>Trello</a>` : '';

            activeCategoryFilter = null;
            isFinalViewFiltered = true; 
            
            isTooltipPinned = false;
            window.pinnedDayKey = null;

            updateFinalViewContent();
            resetScroll('final-view'); 
            finalView.classList.remove('translate-x-full');
        }

        function updateFinalViewContent() {
            let filterText = '';
            if (viewMode === 'CHART_FILTER') {
                filterText = `${chartFilter.monthName} ${chartFilter.year} - ${chartFilter.category}`;
                renderFilterButton('active-search-filter-container', filterText, '');
            } else {
                const query = isFinalViewFiltered ? activeSearchQuery : '';
                renderFilterButton('active-search-filter-container', query, 'unfilterFinalView()');
            }

            let itemsToShow = window.currentViewItems;
            
            if (viewMode === 'CHART_FILTER') {
                itemsToShow = itemsToShow.filter(item => itemMatchesChartFilter(item));
            } else if (isFinalViewFiltered && activeSearchQuery && viewMode !== 'YEAR') {
                itemsToShow = itemsToShow.filter(item => itemMatchesQuery(item, activeSearchQuery));
            }
            
            if (activeCategoryFilter) itemsToShow = itemsToShow.filter(item => item.trabajoDiseno && item.trabajoDiseno.toUpperCase() === activeCategoryFilter);

            const cats = [...new Set(window.currentViewItems.map(i => i.trabajoDiseno ? i.trabajoDiseno.toUpperCase() : 'PRODUCCIÓN'))];
            document.getElementById('category-filters').innerHTML = cats.map(c => {
                 const style = CAT_STYLES[c] || { btnColor: 'bg-slate-500' };
                 const opacity = (activeCategoryFilter && activeCategoryFilter !== c) ? 'opacity-30' : 'opacity-100';
                 return `<button onclick="toggleCategory('${c}')" class="${style.btnColor} text-white px-4 py-2 rounded-full ${opacity} hover:opacity-100 shadow-sm transition-opacity">${toTitleCase(c)}</button>`;
            }).join('');

            // Guardamos para uso del tooltip
            window.currentRenderedFinalItems = itemsToShow;
            document.getElementById('entries-count-badge').innerText = itemsToShow.length;
            
            renderFinalCalendar(itemsToShow); 
        }

        function toggleCategory(c) { activeCategoryFilter = activeCategoryFilter === c ? null : c; updateFinalViewContent(); }
        function unfilterFinalView() { isFinalViewFiltered = false; updateFinalViewContent(); }

        // --- SISTEMA DE TOOLTIP EN CALENDARIO (MODIFICADO) ---
        function togglePinTooltip(event, d, m, y) {
            event.stopPropagation();
            const tooltip = document.getElementById('day-tooltip');
            const clickedDayKey = `${d}-${m}-${y}`;

            if (isTooltipPinned && window.pinnedDayKey === clickedDayKey) {
                // Si ya está fijado y clicamos en el mismo día, lo des-fijamos
                isTooltipPinned = false;
                window.pinnedDayKey = null;
                tooltip.classList.add('pointer-events-none');
                tooltip.classList.remove('pointer-events-auto');
                hideDayTooltip(true);
            } else {
                // Si clicamos en otro o no está fijado, lo fijamos a este día
                isTooltipPinned = true;
                window.pinnedDayKey = clickedDayKey;
                tooltip.classList.remove('pointer-events-none');
                tooltip.classList.add('pointer-events-auto');
                showDayTooltip(event, d, m, y, true);
            }
        }

        function showDayTooltip(event, d, m, y, force = false) {
            if (isTooltipPinned && !force) return;

            const tooltip = document.getElementById('day-tooltip');
            
            // Filtramos los items renderizados para obtener los del día específico
            const items = window.currentRenderedFinalItems.filter(item => {
                if(!item.fecha) return false;
                const parts = item.fecha.split('/');
                return parseInt(parts[0]) === d && parseInt(parts[1]) === m && parseInt(parts[2]) === y;
            });

            if (items.length === 0) return;

            let html = `
                <div class="font-bold text-slate-700 border-b border-slate-100 pb-2 mb-2 flex justify-between items-center">
                    <span>${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}</span>
                    <span class="text-xs font-normal text-slate-500">${items.length} entrada(s)</span>
                </div>
                <div class="max-h-64 overflow-y-auto custom-scrollbar flex flex-col gap-3 pr-1">
            `;

            items.sort((a, b) => parseDate(a.fecha) - parseDate(b.fecha));

            items.forEach((item) => {
                const cat = item.trabajoDiseno ? item.trabajoDiseno.toUpperCase() : 'OTRO';
                const style = CAT_STYLES[cat] || CAT_STYLES['OTRO']; 
                const isFalta = item.check === 'FALTA';
                
                let cardClass = style.card;
                if (isFalta) {
                    cardClass = cardClass.replace(/border-\w+-\d+/g, ''); 
                    cardClass += ' border-2 border-red-600 shadow-[0_0_10px_rgba(220,38,38,0.3)]';
                }
                
                const showHighlight = (viewMode !== 'YEAR' && viewMode !== 'CHART_FILTER' && isFinalViewFiltered);
                const hlDesc = showHighlight ? highlightMatch(item.descripcion, activeSearchQuery) : item.descripcion;

                html += `
                    <div class="p-3 rounded-lg border text-sm ${cardClass} flex flex-col gap-1.5 relative overflow-hidden">
                        <div class="flex justify-between items-center">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${style.badge}">${cat}</span>
                            ${item.drive ? `<a href="${item.drive}" target="_blank" class="text-blue-600 hover:text-blue-800 bg-white/70 hover:bg-white rounded px-1 flex items-center shadow-sm" title="Ver archivo"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg> Ver</a>` : ''}
                        </div>
                        <p class="text-slate-700 leading-relaxed text-xs font-medium">${hlDesc}</p>
                    </div>
                `;
            });

            html += `</div>`;
            
            tooltip.innerHTML = html;
            tooltip.classList.remove('hidden');

            requestAnimationFrame(() => {
                tooltip.classList.remove('opacity-0');
            });

            moveTooltip(event, force);
        }

        function moveTooltip(event, force = false) {
            if (isTooltipPinned && !force) return;
            const tooltip = document.getElementById('day-tooltip');
            if (tooltip.classList.contains('hidden')) return;

            const rect = tooltip.getBoundingClientRect();
            const offset = 15;
            
            // Centrado horizontalmente respecto al cursor
            let x = event.clientX - (rect.width / 2);
            // Arriba del cursor
            let y = event.clientY - rect.height - offset;

            // Evitamos que se salga por los lados de la pantalla
            if (x < 10) x = 10;
            if (x + rect.width > window.innerWidth - 10) {
                x = window.innerWidth - rect.width - 10;
            }

            // Si se sale por arriba de la pantalla, la ponemos por debajo del cursor
            if (y < 10) {
                y = event.clientY + offset;
            }

            tooltip.style.left = `${x}px`;
            tooltip.style.top = `${y}px`;
        }

        function hideDayTooltip(force = false) {
            if (isTooltipPinned && !force) return;
            const tooltip = document.getElementById('day-tooltip');
            tooltip.classList.add('opacity-0');
            
            setTimeout(() => {
                if (tooltip.classList.contains('opacity-0')) {
                    tooltip.classList.add('hidden');
                }
            }, 200);
        }

        function renderFinalCalendar(items) {
            const eventsByDate = {};
            let minDate = null;
            let maxDate = null;

            items.forEach(item => {
                if(!item.fecha) return;
                const [dStr, mStr, yStr] = item.fecha.split('/');
                if(!dStr || !mStr || !yStr) return;
                
                const d = parseInt(dStr);
                const m = parseInt(mStr);
                const y = parseInt(yStr);

                // Registrar mínimo y máximo para dibujar todos los meses
                const totalMonths = y * 12 + m;
                if (minDate === null || totalMonths < minDate) minDate = totalMonths;
                if (maxDate === null || totalMonths > maxDate) maxDate = totalMonths;

                const key = `${y}-${m}`;
                if (!eventsByDate[key]) eventsByDate[key] = {};
                if (!eventsByDate[key][d]) eventsByDate[key][d] = [];
                // Se guarda el item completo para pasarlo al tooltip
                eventsByDate[key][d].push(item);
            });

            if (Object.keys(eventsByDate).length === 0 || minDate === null || maxDate === null) {
                finalCalendarContainer.innerHTML = '<div class="w-full text-center text-slate-300 mt-10">Sin fechas registradas</div>'; return;
            }

            // Generar arreglo de meses continuos
            const continuousMonths = [];
            for (let t = minDate; t <= maxDate; t++) {
                let year = Math.floor((t - 1) / 12);
                let month = ((t - 1) % 12) + 1;
                continuousMonths.push(`${year}-${month}`);
            }
            
            finalCalendarContainer.innerHTML = continuousMonths.map(key => {
                const [y, m] = key.split('-').map(Number); 
                return generateCalendarHTML(m, y, eventsByDate[key] || {}, key);
            }).join('');
        }

        function generateCalendarHTML(month, year, eventsMap, monthKey) {
            const monthIdx = month - 1;
            const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
            const firstDay = new Date(year, monthIdx, 1).getDay();
            
            // Aumentado el ancho a max-w-[340px]
            let h = `<div id="cal-month-${monthKey}" class="w-full max-w-[340px] transition-all duration-500">
                        <div class="text-center font-bold text-slate-700 text-lg mb-3 border-b border-slate-200 pb-2">${MONTH_NAMES[monthIdx]} ${year}</div>
                        <div class="grid grid-cols-7 text-center text-sm font-semibold text-slate-400 mb-2">
                            <div>D</div><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div>
                        </div>
                        <div class="grid grid-cols-7 gap-2 text-base">`; // text-base y gap-2
            
            for(let i=0; i<firstDay; i++) h+=`<div></div>`;
            for(let d=1; d<=daysInMonth; d++) {
                if(eventsMap[d] && eventsMap[d].length > 0) {
                    const firstItemCat = eventsMap[d][0].trabajoDiseno ? eventsMap[d][0].trabajoDiseno.toUpperCase() : 'OTRO';
                    const dotColorClass = (CAT_STYLES[firstItemCat] || { dotClass: 'bg-slate-400' }).dotClass;
                    
                    // Añadido onclick y clase day-dot
                    h += `<div class="day-dot aspect-square rounded-lg flex items-center justify-center font-bold text-white shadow-sm ${dotColorClass} transition-transform duration-200 cursor-pointer hover:scale-110 relative z-10" 
                            onmouseenter="showDayTooltip(event, ${d}, ${month}, ${year})" 
                            onmousemove="moveTooltip(event)" 
                            onmouseleave="hideDayTooltip()"
                            onclick="togglePinTooltip(event, ${d}, ${month}, ${year})">${d}</div>`;
                } else {
                    h += `<div class="aspect-square flex items-center justify-center text-slate-300">${d}</div>`;
                }
            }
            h += `</div></div>`;
            return h;
        }

        function parseDate(dStr) { 
            if(!dStr) return 0; const parts = dStr.split('/');
            if(parts.length !== 3) return 0; return new Date(parts[2], parts[1]-1, parts[0]).getTime(); 
        }

        function toTitleCase(s) { return s.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase()); }
        
        function resetScroll(containerId) {
            const view = document.getElementById(containerId);
            if (view) { const main = view.querySelector('main'); if (main) main.scrollTop = 0; }
            if (containerId === 'final-view') {
                if (document.getElementById('final-calendar-container')) document.getElementById('final-calendar-container').scrollTop = 0;
            }
        }

        // --- SISTEMA DE NAVEGACIÓN ---
        function openResultsView() { 
            resetScroll('results-view'); 
            searchView.classList.add('-translate-y-full', 'opacity-0'); 
            resultsView.classList.remove('translate-y-full'); 
        }

        function openProjectListView(clientName) {
            if(!clientName) return;
            currentClientName = clientName;
            isProjectListFiltered = true;
            renderProjectListContent();
            resetScroll('project-list-view'); 
            projectListView.classList.remove('translate-x-full');
        }
        
        function closeResults() { 
            if (viewMode === 'CHART_FILTER' && chartFilter) {
                resultsView.classList.add('translate-y-full');
                chartView.classList.remove('translate-x-full');
                return;
            }

            activeSearchQuery=''; 
            viewMode = 'CLIENT'; 
            activeYearFilter = '';
            chartFilter = null;
            mainInput.value=''; 
            headerInput.value=''; 
            resultsView.classList.add('translate-y-full'); 
            searchView.classList.remove('-translate-y-full', 'opacity-0'); 
            projectListView.classList.add('translate-x-full'); 
            finalView.classList.add('translate-x-full'); 
            if (typeof chartView !== 'undefined') chartView.classList.add('translate-x-full');
            setTimeout(()=>mainInput.focus(),500); 
        }
        
        function closeProjectListView() { 
            resetScroll('results-view'); 
            projectListView.classList.add('translate-x-full'); 
            if(viewMode === 'YEAR') closeResults(); 
        }
        
        function closeFinalView() { 
            resetScroll('project-list-view'); 
            finalView.classList.add('translate-x-full'); 
            
            isTooltipPinned = false;
            window.pinnedDayKey = null;
            hideDayTooltip(true);
        }
    </script>
</body>
</html>
